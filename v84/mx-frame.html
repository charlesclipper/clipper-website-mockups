<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ca-measure" content="no-ga no-replay">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https: http:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'none'">
<title>Maintenance request</title>
<link rel="stylesheet" href="css/frame-style.css">
<style>html body{margin:0 !important;padding:0 !important;background:transparent;overflow:visible}</style>
</head>
<body>
<form class="form" data-mock-form data-mx-mailto data-form-id="maintenance-mailto" novalidate>
          <p class="req-note full">Fields marked <span aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>
          <div class="field"><label for="mq-name">Full name <span class="req" aria-hidden="true">*</span></label><input id="mq-name" name="name" required autocomplete="name" data-label="Full name" data-err="Enter your full name."></div>
          <div class="field"><label for="mq-email">Email <span class="req" aria-hidden="true">*</span></label><input id="mq-email" name="email" type="email" required autocomplete="email" data-label="Email" data-err="Enter your email address."></div>
          <div class="field"><label for="mq-phone">Phone</label><input id="mq-phone" name="phone" type="tel" autocomplete="tel" data-label="Phone"></div>
          <div class="field"><label for="mq-aircraft">Aircraft make/model <span class="req" aria-hidden="true">*</span></label><input id="mq-aircraft" name="aircraft" required autocomplete="off" placeholder="For example, King Air 350" data-label="Aircraft make/model" data-err="Enter the aircraft make and model."></div>
          <div class="field"><label for="mq-tail">Tail number</label><input id="mq-tail" name="tail" autocomplete="off" data-label="Tail number"></div>
          <div class="field"><label for="mq-service">Service needed</label><select id="mq-service" name="service" data-label="Service needed"><option value="">Select a service</option><option>Inspection</option><option>Pitot-static and transponder testing</option><option>Avionics</option><option>AOG / repair</option><option>Parts</option><option>Other</option></select></div>
          <div class="field"><label for="mq-date">Preferred date</label><input id="mq-date" name="date" type="date" data-label="Preferred date"></div>
          <div class="field full"><label for="mq-details">Details</label><textarea id="mq-details" name="details" data-label="Details"></textarea></div>
          <div class="full">
            <div class="hp-field" aria-hidden="true"><label>Leave this field empty <input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>
          </div>
          <div class="full quote-submit"><button class="btn btn-primary" type="submit">Send Request</button> <span class="form-note">&nbsp; Opens your email app. Nothing is sent from this page.</span></div>
        </form>
        <div class="form-success" role="status" tabindex="-1"><p class="label copper">Almost done</p><p class="h3">Your email app should be opening.</p><p>Your request is ready to send to our maintenance team. If nothing opens, <a data-mx-reopen href="mailto:mx@clipperaviation.com">open the email again</a> or write to us directly at <a href="mailto:mx@clipperaviation.com">mx@clipperaviation.com</a>.</p></div>
<script src="js/main.js" defer></script>
<script src="js/mx-mailto.js" defer></script>
<script src="js/quote-frame.js" defer></script>

</body>
</html>
